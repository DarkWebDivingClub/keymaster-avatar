[package]
name = "pkcs11-x509"
version = "0.1.0"
edition = "2021"
description = "PKCS#11 module for KeyMaster X.509 keys - thin client of km-x509-sa"

[lib]
crate-type = ["cdylib"]
name = "km_pkcs11_x509"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Certificate field parsing (subject, issuer, serial as DER). Never builds certificates.
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
